version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: urna_ngv_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urna_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urna_secret}
      POSTGRES_DB: ${POSTGRES_DB:-urna_ngv}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-urna_admin} -d ${POSTGRES_DB:-urna_ngv}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
